plugins {
    id 'fabric-loom' version "$loom_version"
}

group = project.mod_group
version = project.mod_version

println("Building on Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}) Arch: ${System.getProperty('os.arch')}")
println("Minecraft ${project.minecraft_version}, Fabric API ${project.fabric_api_version}")

repositories {
    maven {
        url = "https://maven.shedaniel.me/"
        content {
            // ClothConfig
            includeModule("me.shedaniel.cloth", "cloth-config-fabric")
            includeModule("me.shedaniel.cloth", "basic-math")
        }
    }
    maven {
        url = "https://maven.bai.lol"
        content {
            // WTHIT
            includeModule("lol.bai", "badpackets")
            includeModule("mcp.mobius.waila", "wthit")
            includeModule("mcp.mobius.waila", "wthit-api")
        }
    }
    maven {
        url = "https://staging.alexiil.uk/maven/"
        content {
            // LibGUI
            includeModule("io.github.cottonmc", "LibGui")
            includeModule("io.github.cottonmc", "Jankson-Fabric")
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    compileOnly 'org.apache.commons:commons-lang3:3.17.0'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.24.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'com.google.code.gson:gson:2.11.0'

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}") {
        exclude(Map.of("module", "fabric-api-deprecated"))
    }

    // LibGui
    modImplementation include("io.github.cottonmc:LibGui:${project.libgui_version}")

    // Cloth Config
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // WTHIT (WAILA)
    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}"
    modRuntimeOnly "mcp.mobius.waila:wthit:fabric-${project.wthit_version}"
    modRuntimeOnly "lol.bai:badpackets:fabric-${project.badpackets_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "mod_id": providers.gradleProperty("mod_id").get(),
                "mod_version": providers.gradleProperty("mod_version").get(),
                "mod_name": providers.gradleProperty("mod_name").get(),
                "mod_description": providers.gradleProperty("mod_description").get(),
                "java_version_range": providers.gradleProperty("java_version_range").get(),
                "minecraft_version_range": providers.gradleProperty("minecraft_version_range").get(),
                "fabric_loader_version_range": providers.gradleProperty("fabric_loader_version_range").get(),
                "fabric_api_version_range": providers.gradleProperty("fabric_api_version_range").get(),
                "cloth_config_version_range": providers.gradleProperty("cloth_config_version_range").get(),
                "wthit_version_range": providers.gradleProperty("wthit_version_range").get()
    }
}

remapJar {
    archiveClassifier = "fabric${project.minecraft_version}"

    from rootProject.file("LICENSE.md")
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"

    // Minecraft 1.21 upwards uses Java 21.
    it.options.release = 21
}

base {
    archivesName = project.mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${providers.gradleProperty("mod_id").get()}" }
    }
}

fabricApi {
    configureDataGeneration()
}
